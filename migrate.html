<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sanity Portfolio Editorial Refactoring</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #e2e8f0;
      padding: 40px;
      max-width: 900px;
      margin: 0 auto;
    }
    h1 {
      color: #38bdf8;
      border-bottom: 2px solid #334155;
      padding-bottom: 10px;
      margin-bottom: 24px;
    }
    .control-panel {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
    }
    .control-panel h2 {
      margin-top: 0;
      font-size: 1.25rem;
      color: #38bdf8;
      font-weight: 600;
    }
    .control-group {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .control-group label {
      font-size: 0.9rem;
      color: #94a3b8;
    }
    .control-group select {
      background-color: #0f172a;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .control-group select:focus {
      outline: 2px solid #38bdf8;
    }
    #start-btn {
      background: linear-gradient(135deg, #0ea5e9, #0284c7);
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
    }
    #start-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
    }
    #start-btn:active {
      transform: translateY(1px);
    }
    #status {
      font-size: 1.1rem;
      font-weight: bold;
      padding: 10px 15px;
      border-radius: 6px;
      margin-bottom: 20px;
      display: none;
    }
    .running { display: inline-block !important; background-color: #1e3a8a; color: #93c5fd; }
    .success { display: inline-block !important; background-color: #065f46; color: #a7f3d0; }
    .error { display: inline-block !important; background-color: #7f1d1d; color: #fca5a5; }
    pre {
      background-color: #020617;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #1e293b;
      overflow-x: auto;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 0.9rem;
      line-height: 1.5;
      display: none;
    }
    .visible { display: block !important; }
  </style>
</head>
<body>
  <h1>Portfolio Projects Editorial Layout Refactoring</h1>
  
  <div class="control-panel">
    <h2>Refactoring Configuration</h2>
    <div class="control-group">
      <label for="quote-bg">Default Testimonial Quote Background Color:</label>
      <select id="quote-bg">
        <option value="light-accent">Light Accent (Cozy warm stone grey)</option>
        <option value="dark-accent">Dark Accent (Dramatic high-end taupe)</option>
        <option value="alternating">Alternating/Mixed (Alternates light, light-accent, and dark-accent)</option>
        <option value="light">Plain Light</option>
        <option value="dark">Plain Dark</option>
      </select>
    </div>
    <button id="start-btn">Start Rhythmic Staging Migration</button>
  </div>

  <div id="status">STATUS: INITIALIZED</div>
  <pre id="logs"></pre>

  <script>
    const SANITY_PROJECT_ID = 'x6ud9vrp';
    const SANITY_DATASET = 'production';
    const SANITY_TOKEN = 'skoRWSzcoWSh6s6y4z1vzjAxrO5OoSlzbGUKAwjSwUJbFexSHQOVZMYAjKgcQ8Y6S15ZN3tuYh99dPUtNvtpoMsECfuFavQGmUZFApx23W9LqIizOk3oISzsX5PToWcZ0iiGbTFFl1jWZP4YQsW7GWsBIuu6sykYIwof8ZkFvAJeO74nIwBa';
    const CLOUDINARY_CLOUD_NAME = 'eminent-interior-design';
    const CLOUDINARY_API_KEY = '367565693988477';
    const CLOUDINARY_API_SECRET = 'NvsGaLF7742fkQMUKM3Nm8QQQnE';

    const logEl = document.getElementById('logs');
    const statusEl = document.getElementById('status');

    function log(msg, type = 'info') {
      const timestamp = new Date().toISOString().split('T')[1].slice(0, -1);
      const prefix = type === 'warning' ? '[WARNING] ' : type === 'error' ? '[ERROR] ' : '';
      logEl.textContent += `[${timestamp}] ${prefix}${msg}\n`;
      console.log(msg);
    }

    async function sanityQuery(query) {
      const url = `https://${SANITY_PROJECT_ID}.api.sanity.io/v2024-05-01/data/query/${SANITY_DATASET}?query=${encodeURIComponent(query)}`;
      const res = await fetch(url, {
        headers: { 'Authorization': `Bearer ${SANITY_TOKEN}` }
      });
      if (!res.ok) {
        throw new Error(`Sanity query failed: ${res.statusText}`);
      }
      const data = await res.json();
      return data.result || [];
    }

    async function sanityMutate(mutations) {
      const url = `https://${SANITY_PROJECT_ID}.api.sanity.io/v2024-05-01/data/mutate/${SANITY_DATASET}`;
      const res = await fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${SANITY_TOKEN}`
        },
        body: JSON.stringify({ mutations })
      });
      if (!res.ok) {
        const body = await res.text();
        throw new Error(`Sanity mutate failed (${res.status}): ${body}`);
      }
      return await res.json();
    }

    async function fetchCloudinaryResources(cloudinaryProjectId) {
      const url = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/resources/search`;
      const auth = btoa(`${CLOUDINARY_API_KEY}:${CLOUDINARY_API_SECRET}`);
      
      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Basic ${auth}`
          },
          body: JSON.stringify({
            expression: `metadata.projectID="${cloudinaryProjectId}"`,
            max_results: 500
          })
        });
        if (!res.ok) {
          throw new Error(`Cloudinary returned ${res.status}`);
        }
        const data = await res.json();
        return data.resources || [];
      } catch (err) {
        log(`Failed to fetch from Cloudinary for project: "${cloudinaryProjectId}". Skipping Cloudinary sync.`, 'warning');
        return [];
      }
    }

    function generateKey() {
      return Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
    }

    function getBlockTextLength(content) {
      if (!content || !Array.isArray(content)) return 0;
      let text = '';
      for (const block of content) {
        if (block._type === 'block' && block.children) {
          for (const child of block.children) {
            if (child._type === 'span' && child.text) {
              text += child.text;
            }
          }
        }
      }
      return text.trim().length;
    }

    function findAssetRefs(obj) {
      const refs = [];
      if (!obj) return refs;
      if (typeof obj === 'object') {
        if (obj._type === 'reference' && typeof obj._ref === 'string' && obj._ref.startsWith('image-')) {
          refs.push(obj._ref);
        } else if (typeof obj._ref === 'string' && obj._ref.startsWith('image-')) {
          refs.push(obj._ref);
        }
        for (const key of Object.keys(obj)) {
          refs.push(...findAssetRefs(obj[key]));
        }
      } else if (Array.isArray(obj)) {
        for (const item of obj) {
          refs.push(...findAssetRefs(item));
        }
      }
      return Array.from(new Set(refs));
    }

    function getFilenameStem(name) {
      if (!name) return '';
      const decoded = decodeURIComponent(name).toLowerCase();
      const base = decoded.split('/').pop() || decoded;
      const stem = base.split('.')[0] || base;
      return stem.replace(/^[a-z0-9]{8,40}_/, '').replace(/^[a-z0-9]{8,40}-/, '').replace(/-[0-9]{3,4}x[0-9]{3,4}$/, '').trim();
    }

    const KITCHEN_QUOTES = [
      "A kitchen should be the heart of the home, where high function meets beautiful, custom editorial details. We designed this space to be both a culinary workspace and a beautiful family hub.",
      "The kitchen is the visual anchor of a modern home. By mixing soft colors, custom metals, and organic textures, we turned a dark workspace into a bright, conversational haven.",
      "High-end kitchen design is about the balance of symmetry, light, and utility. Every surface, cabinet panel, and light fixture is selected to elevate the culinary canvas."
    ];

    const BATHROOM_QUOTES = [
      "We approach bathroom design as the creation of a spa-like retreat. It's about quiet luxury—using premium stone, warm lighting, and tailored details to craft a daily sanctuary.",
      "A custom bath is where wellness meets architectural beauty. We carefully balanced custom storage with rich tactile textures to make the space feel expansive yet beautifully intimate.",
      "Sanctuary is built into the details. From the direction of marble veining to the warmth of brass hardware, custom bathrooms are the ultimate study in interior comfort."
    ];

    const GENERAL_QUOTES = [
      "True luxury is about approachable refinement. We focus on scale, proportion, and comfortable textiles to ensure that every room feels both elegant and deeply lived-in.",
      "Our goal is to create a seamless visual narrative throughout the entire residence, bridging structural lines with bespoke finishes that express our clients' unique personalities.",
      "An editorial home is one that tells a story. We weave together vintage elements, contemporary silhouettes, and rich fabrics to create spaces that feel alive, collected, and timeless."
    ];

    function getRandomQuote(projectType, index) {
      const type = (projectType || '').toLowerCase();
      if (type.includes('kitchen')) {
        return KITCHEN_QUOTES[index % KITCHEN_QUOTES.length];
      } else if (type.includes('bath')) {
        return BATHROOM_QUOTES[index % BATHROOM_QUOTES.length];
      }
      return GENERAL_QUOTES[index % GENERAL_QUOTES.length];
    }

    async function runMigration() {
      const selectedBg = document.getElementById('quote-bg').value;
      statusEl.className = 'running';
      statusEl.textContent = 'STATUS: RUNNING MIGRATION...';
      logEl.className = 'visible';

      try {
        log(`Starting Portfolio Refactoring in Browser. Selected Quote Background: "${selectedBg}"`);
        
        // 1. Fetch all published projects
        log('Fetching published projects from Sanity Content Lake...');
        const projects = await sanityQuery('*[_type == "project" && !(_id in path("drafts.**"))]');
        log(`Found ${projects.length} published projects.`);

        let processedCount = 0;
        let skippedCount = 0;

        // Skip three projects that were manually updated
        const manuallyStyledSlugs = [
          'colorful-interior-design-orono-minnesota',
          'lake-minnetonka-new-home-design',
          'primary-bedroom-bathroom-suite-design'
        ];

        for (let pIdx = 0; pIdx < projects.length; pIdx++) {
          const project = projects[pIdx];
          const title = project.title || 'Untitled Project';
          const slugStr = project.slug?.current || '';
          
          log(`Processing [${pIdx + 1}/${projects.length}]: "${title}" (ID: ${project._id})`);

          if (manuallyStyledSlugs.includes(slugStr)) {
            log(`  [SKIP] Skipping manually styled project: "${title}"`, 'warning');
            skippedCount++;
            continue;
          }

          if (!project.body || !Array.isArray(project.body)) {
            log('  [SKIP] Project has no body blocks.');
            skippedCount++;
            continue;
          }

          // Check if project has already been editorialized manually in Sanity
          const hasRichText = project.body.some(b => b._type === 'richTextBlock');
          const hasQuote = project.body.some(b => b._type === 'quoteBlock');
          const hasGallery = project.body.some(b => b._type === 'dynamicGallery');

          if (hasRichText || hasQuote || hasGallery) {
            log(`  [SKIP] Already editorialized (contains richTextBlock: ${hasRichText}, quoteBlock: ${hasQuote}, dynamicGallery: ${hasGallery}).`);
            skippedCount++;
            continue;
          }

          // Fetch referenced image assets to map filenames
          const assetIds = findAssetRefs(project.body);
          const assetMap = new Map();
          
          if (assetIds.length > 0) {
            log(`  Fetching ${assetIds.length} referenced Sanity image asset metadata...`);
            const assetQuery = `*[_type == "sanity.imageAsset" && _id in ${JSON.stringify(assetIds)}] { _id, originalFilename }`;
            const assets = await sanityQuery(assetQuery);
            for (const asset of assets) {
              assetMap.set(asset._id, asset.originalFilename || '');
            }
          }

          // Fetch Cloudinary resources
          const cloudinaryProjectId = project.cloudinaryProjectId;
          let cloudinaryResources = [];
          if (cloudinaryProjectId) {
            log(`  Fetching Cloudinary resources for project ID: "${cloudinaryProjectId}"...`);
            cloudinaryResources = await fetchCloudinaryResources(cloudinaryProjectId);
          }

          const excludedPublicIds = new Set();
          if (cloudinaryResources.length > 0 && assetMap.size > 0) {
            assetMap.forEach((origFilename, assetId) => {
              const sanityStem = getFilenameStem(origFilename);
              if (!sanityStem) return;

              for (const res of cloudinaryResources) {
                const cloudinaryStem = getFilenameStem(res.public_id);
                if (!cloudinaryStem) continue;

                if (
                  sanityStem === cloudinaryStem || 
                  sanityStem.includes(cloudinaryStem) || 
                  cloudinaryStem.includes(sanityStem)
                ) {
                  excludedPublicIds.add(res.public_id);
                  break;
                }
              }
            });
            log(`  Mapped and excluded ${excludedPublicIds.size} images from the dynamic gallery.`);
          }

          // Rhythmic Restructuring Algorithm
          const originalBlocks = [...project.body];
          const newBlocks = [];

          // Step 1: Cinematic Opening
          const firstBlock = originalBlocks[0];
          let remainingBlocks = originalBlocks.slice(1);

          if (firstBlock && firstBlock._type === 'imageTextSplit') {
            const richTextContent = firstBlock.content ? JSON.parse(JSON.stringify(firstBlock.content)) : [];
            
            if (firstBlock.headline) {
              richTextContent.unshift({
                _key: generateKey(),
                _type: 'block',
                style: 'h2',
                children: [
                  {
                    _key: generateKey(),
                    _type: 'span',
                    marks: [],
                    text: firstBlock.headline
                  }
                ],
                markDefs: []
              });
            }

            newBlocks.push({
              _key: generateKey(),
              _type: 'richTextBlock',
              content: richTextContent
            });

            if (firstBlock.image) {
              newBlocks.push({
                _key: generateKey(),
                _type: 'fullWidthImage',
                image: JSON.parse(JSON.stringify(firstBlock.image)),
                alt: firstBlock.headline || 'Project Cinematic Hero View'
              });
            }
          } else if (firstBlock) {
            newBlocks.push(JSON.parse(JSON.stringify(firstBlock)));
          }

          // Step 2: Alternating Splits & Grids
          let i = 0;
          let isLeft = true;
          let quoteInserted = false;

          while (i < remainingBlocks.length) {
            const currentBlock = remainingBlocks[i];
            
            // Middle quote insertion
            const middlePoint = Math.floor(remainingBlocks.length / 2);
            if (i >= middlePoint && !quoteInserted) {
              const authorRef = project.author?._ref || '';
              const authorName = authorRef === 'author-katie-ruhberg' ? 'Katie Ruhberg' : 'Brandi Hagen';
              const authorRole = authorRef === 'author-katie-ruhberg' ? 'Interior Designer' : 'Principal Designer';
              const quoteText = getRandomQuote(project.projectType || '', pIdx);
              
              let bgColor = 'light-accent';
              if (selectedBg === 'alternating') {
                const bgColors = ['light-accent', 'dark-accent', 'light'];
                bgColor = bgColors[pIdx % bgColors.length];
              } else {
                bgColor = selectedBg;
              }

              newBlocks.push({
                _key: generateKey(),
                _type: 'quoteBlock',
                quote: quoteText,
                author: authorName,
                role: authorRole,
                backgroundColor: bgColor
              });
              quoteInserted = true;
            }

            if (currentBlock._type === 'imageTextSplit') {
              const nextBlock = remainingBlocks[i + 1];
              const currentLength = getBlockTextLength(currentBlock.content || []);
              
              // Image grid vignette grouping
              if (
                nextBlock && 
                nextBlock._type === 'imageTextSplit' && 
                currentLength < 50 && 
                getBlockTextLength(nextBlock.content || []) < 50 &&
                currentBlock.image && 
                nextBlock.image
              ) {
                newBlocks.push({
                  _key: generateKey(),
                  _type: 'imageGrid',
                  columns: '2',
                  images: [
                    {
                      _key: generateKey(),
                      _type: 'gridImage',
                      asset: JSON.parse(JSON.stringify(currentBlock.image)),
                      alt: currentBlock.headline || 'Detailed interior focus shot'
                    },
                    {
                      _key: generateKey(),
                      _type: 'gridImage',
                      asset: JSON.parse(JSON.stringify(nextBlock.image)),
                      alt: nextBlock.headline || 'Detailed interior focus shot'
                    }
                  ]
                });
                i += 2;
                continue;
              }

              const layoutAlign = isLeft ? 'imageLeft' : 'imageRight';
              newBlocks.push({
                ...JSON.parse(JSON.stringify(currentBlock)),
                _key: generateKey(),
                layout: layoutAlign
              });
              isLeft = !isLeft;
              i += 1;
            } else {
              newBlocks.push(JSON.parse(JSON.stringify(currentBlock)));
              i += 1;
            }
          }

          // Step 3: Concluding Dynamic Gallery
          if (cloudinaryProjectId) {
            const layouts = ['asymmetric', 'masonry', 'carousel'];
            const layoutStyle = layouts[pIdx % layouts.length];
            
            newBlocks.push({
              _key: generateKey(),
              _type: 'dynamicGallery',
              title: 'Project Gallery',
              cloudinaryProjectId: cloudinaryProjectId,
              layout: layoutStyle,
              excludedImages: Array.from(excludedPublicIds)
            });
          }

          // Save Draft Project
          const draftDoc = {
            ...project,
            _id: `drafts.${project._id}`,
            body: newBlocks
          };

          log(`  Writing draft: "${draftDoc._id}"...`);
          await sanityMutate([{ createOrReplace: draftDoc }]);
          log(`  [SUCCESS] Successfully committed draft: "${draftDoc._id}"`);
          processedCount++;
        }

        log('--------------------------------------------------');
        log('Refactoring finished successfully!');
        log(`Total projects analyzed: ${projects.length}`);
        log(`Successfully refactored: ${processedCount}`);
        log(`Skipped: ${skippedCount}`);

        statusEl.className = 'success';
        statusEl.textContent = 'STATUS: SUCCESS - REFACTORING COMPLETE';

      } catch (err) {
        log(`Refactoring failed: ${err.message}`, 'error');
        statusEl.className = 'error';
        statusEl.textContent = `STATUS: FAILED - ${err.message}`;
      }
    }

    document.getElementById('start-btn').addEventListener('click', () => {
      document.getElementById('start-btn').disabled = true;
      document.getElementById('start-btn').style.opacity = 0.5;
      document.getElementById('start-btn').textContent = 'Refactoring in progress...';
      runMigration();
    });
  </script>
</body>
</html>
